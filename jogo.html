// ====== TEXTURA DO MAR ======
// Água em pixel art (azul escuro, azul claro e linhas de espuma), gerada em código
// no mesmo estilo da imagem enviada, e repetida sem emendas pelo mar todo.
const PX_AGUA = 8;            // tamanho de cada "pixel" da textura no mundo
let marSrc = null;
(function criarMar() {
  const N = 96, SEEDS = 15;
  let s = 20261023;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  const sem = [];
  for (let i = 0; i < SEEDS; i++) {
    const a = rnd() * Math.PI * 2;
    sem.push({ x: rnd() * N, y: rnd() * N, ax: Math.cos(a), ay: Math.sin(a), lim: 0.15 + rnd() * 0.3 });
  }
  const pq = document.createElement("canvas"); pq.width = pq.height = N;
  const pc = pq.getContext("2d");
  const dados = pc.createImageData(N, N);
  const ESPUMA = [226, 232, 242], CLARO = [102, 204, 255], ESCURO = [26, 155, 255];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let d1 = 1e9, d2 = 1e9, w = null, wx = 0, wy = 0;
    for (const sd of sem) {
      let dx = x - sd.x, dy = y - sd.y;
      dx -= Math.round(dx / N) * N; dy -= Math.round(dy / N) * N; // sem emendas
      const d = Math.hypot(dx, dy);
      if (d < d1) { d2 = d1; d1 = d; w = sd; wx = dx; wy = dy; }
      else if (d < d2) d2 = d;
    }
    let c;
    if (d2 - d1 < 2.6) c = ESPUMA;
    else {
      const proj = (wx * w.ax + wy * w.ay) / Math.max(d1, 1);
      c = (proj > w.lim && d1 > 4) ? ESCURO : CLARO;
    }
    const i = (y * N + x) * 4;
    dados.data[i] = c[0]; dados.data[i + 1] = c[1]; dados.data[i + 2] = c[2]; dados.data[i + 3] = 255;
  }

// --- sprites pré-escalados para o tamanho exato da tela (nítidos, sem custo por quadro) ---
let cowSpr = null;
function passoEscala(src, w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = "high";
  x.drawImage(src, 0, 0, w, h);
  return c;
}
function escalarSprite(src, f) {
  const tw = Math.max(1, Math.round(src.width * f)), th = Math.max(1, Math.round(src.height * f));
  let cur = src;
  // reduz pela metade em etapas (evita serrilhado ao diminuir bastante)
  while (cur.width / 2 >= tw && cur.height / 2 >= th) cur = passoEscala(cur, Math.round(cur.width / 2), Math.round(cur.height / 2));
  if (cur.width !== tw || cur.height !== th) cur = passoEscala(cur, tw, th);
  return cur;
}
let cowBase = null, tz = 0.55, tzp = 0.55;   // tz: zoom em que as texturas foram feitas
function montarSpritesVaca() {
  if (!cowImg.complete || !cowImg.naturalWidth) return;
  if (!cowBase) {                       // recorta os quadros uma única vez
    cowBase = {};
    for (const nome in COW_FRAMES) {
      const q = COW_FRAMES[nome];
      const c0 = document.createElement("canvas"); c0.width = q.w; c0.height = q.h;
      c0.getContext("2d").drawImage(cowImg, q.x, q.y, q.w, q.h, 0, 0, q.w, q.h);
      cowBase[nome] = c0;
    }
  }
  cowSpr = {};                          // descarta as versões escaladas; cada quadro é refeito só quando for usado
}
function sprVaca(nome) {
  let s = cowSpr[nome]; if (s) return s;
  const q = COW_FRAMES[nome], f = tzp * VACA.ESCALA;
  const d = escalarSprite(cowBase[nome], f);
  const e = document.createElement("canvas"); e.width = d.width; e.height = d.height;
  const ex = e.getContext("2d"); ex.translate(d.width, 0); ex.scale(-1, 1); ex.drawImage(d, 0, 0);
  const ax = Math.round(q.ax * f);
  return (cowSpr[nome] = { d, e, ax, axE: d.width - ax, ay: Math.round(q.ay * f), bw: q.bw * f });
}

const vacas = [];
let jogadorAndando = false, ultimoAtaque = 0, dbgMsg = "";
const aleatorio = (a, b) => a + Math.random() * (b - a);
const distAgua = (x, y) => Math.min(x, y, MUNDO - x, MUNDO - y);
const jogX = () => p.x + TAM_JOGADOR / 2;      // pés do jogador (chão)
const jogY = () => p.y + TAM_JOGADOR * 0.85;

// ====== NATAÇÃO ======
// O jogador pode entrar nos lagos e no mar: fica mais lento, afunda um pouco e deixa ondinhas.
const LIM_NADO = MAR - 250;          // até onde dá para nadar no mar (a câmera enxerga MAR de mar ao redor)
const VEL_NADO = 0.6;                // fração da velocidade normal enquanto nada

const naAgua = (x, y) => x < 0 || y < 0 || x > MUNDO || y > MUNDO || dentroLago(x, y, 0);
let nadando = false, nadoT = 0, ondaT = 0;

function marolas(n) { for (let i = 0; i < n; i++) ondas.push({ x: jogX(), y: jogY(), t: -i * 0.14 }); }

function novaVaca(x, y) {
  const c = { x, y, hx: x, hy: y, vx: 0, vy: 0, dir: Math.random() < .5 ? -1 : 1,
    est: "idle", t: 0, dur: aleatorio(.4, 2.5), fi: 0, ft: 0, hp: VACA.VIDA,
    alvo: null, forcado: 0, morrer: false, acordou: false, tMorte: 0, dbg: -1 };
  vacas.push(c); return c;
}
(function povoar() {
  // vacas espalhadas aleatoriamente por toda a ilha (longe da beira e do ponto inicial do jogador)
  const cx = MUNDO / 2, cy = MUNDO / 2, M = VACA.MARGEM + 120, TOTAL = 40;
  for (let i = 0, tent = 0; i < TOTAL && tent < 1000; tent++) {
    const x = aleatorio(M, MUNDO - M), y = aleatorio(M, MUNDO - M);
    if (Math.hypot(x - cx, y - cy) < 250) continue;                          // não nasce em cima do jogador
    if (dentroLago(x, y, 120)) continue;                                      // nem dentro de um lago
    if (vacas.some(v => Math.hypot(v.x - x, v.y - y) < 160)) continue;       // não nasce em cima de outra vaca
    novaVaca(x, y); i++;
  }
})();


function mudarEstado(c, est, dur) { c.est = est; c.t = 0; c.dur = dur || 0; c.fi = 0; c.ft = 0; }

function decidir(c) {
  const r = Math.random();
  const lp = lagoPerto(c.x, c.y, VACA.AGUA);
  if (lp && r < .3) {                                  // bebe virada para o lago
    c.dir = lp.l.x < c.x ? -1 : 1;
    return mudarEstado(c, "drink", aleatorio(4, 7));
  }
  if (r >= .3 && r < .4) {                             // vai até um lago por perto para beber
    const l2 = lagoPerto(c.x, c.y, 1300);
    if (l2) {
      const a = Math.atan2(c.y - l2.l.y, c.x - l2.l.x), R = raioLago(l2.l, a) + 50;
      c.alvo = { x: l2.l.x + Math.cos(a) * R, y: l2.l.y + Math.sin(a) * R };
      c.lagoAlvo = l2.l;
      return mudarEstado(c, "walk", 25);
    }
  }
  if (distAgua(c.x, c.y) < VACA.AGUA && r < .3) {      // bebe virada para o mar
    const dl = c.x, dr = MUNDO - c.x, du = c.y, db = MUNDO - c.y, m = Math.min(dl, dr, du, db);
    if (m === dl) c.dir = -1; else if (m === dr) c.dir = 1;
    return mudarEstado(c, "drink", aleatorio(4, 7));
  }
  if (r < .45) {
    const a = Math.random() * 6.283, d = aleatorio(150, 500);
    c.alvo = { x: Math.max(VACA.MARGEM, Math.min(MUNDO - VACA.MARGEM, c.hx + Math.cos(a) * d)),
               y: Math.max(VACA.MARGEM, Math.min(MUNDO - VACA.MARGEM, c.hy + Math.sin(a) * d * .7)) };
    const o = empurrarLagos(c.alvo.x, c.alvo.y, 60); c.alvo.x = o[0]; c.alvo.y = o[1];
    return mudarEstado(c, "walk", 14);
  }
  if (r < .75) return mudarEstado(c, "eat", aleatorio(5, 9));
  if (r < .88) { c.acordou = false; return mudarEstado(c, "rest", aleatorio(3, 6)); }
  mudarEstado(c, "idle", aleatorio(1.5, 3));
}

function acelerar(c, tx, ty, dt, acel) {
  const ax = tx - c.vx, ay = ty - c.vy, l = Math.hypot(ax, ay), m = acel * dt;
  if (l <= m || l < 1e-6) { c.vx = tx; c.vy = ty; } else { c.vx += ax / l * m; c.vy += ay / l * m; }
}
function fugir(c) { c.lagoAlvo = null; mudarEstado(c, "run", 0); }

function causarDano(c, origemX, origemY) {
  if (c.est === "death" || c.est === "hurt") return;
  c.hp--; c.morrer = c.hp <= 0;
  mudarEstado(c, "hurt", 0.5);
  let ux = c.x - origemX, uy = c.y - origemY; const l = Math.hypot(ux, uy) || 1;
  c.vx = ux / l * 170; c.vy = uy / l * 170;          // empurrão
}
function atacar() {
  const agora = performance.now();
  if (agora - ultimoAtaque < 450) return;
  ultimoAtaque = agora;
  let alvo = null, md = 130;
  for (const c of vacas) {
    if (c.est === "death") continue;
    const d = Math.hypot(c.x - jogX(), (c.y - jogY()) * 1.4);
    if (d < md) { md = d; alvo = c; }
  }
  if (alvo) causarDano(alvo, jogX(), jogY());
}

function testarAnimacao() {
  let alvo = null, md = 700;
  for (const c of vacas) { const d = Math.hypot(c.x - jogX(), c.y - jogY()); if (d < md) { md = d; alvo = c; } }
  if (!alvo) return;
  alvo.dbg = (alvo.dbg + 1) % ESTADOS_VACA.length;
  const est = ESTADOS_VACA[alvo.dbg];
  alvo.forcado = 3.5; alvo.morrer = false; alvo.hp = est === "death" ? 0 : VACA.VIDA; alvo.tMorte = 0;
  alvo.vx = alvo.vy = 0; mudarEstado(alvo, est, 0);
}

function animarVaca(c, dt) {
  const A = ANIM_VACA[c.est];
  if (A.q.length < 2) return;
  c.ft += dt;
  while (c.ft >= A.dur[c.fi]) { c.ft -= A.dur[c.fi]; c.fi = (c.fi + 1) % A.q.length; }
}

function moverVaca(c, dt) {
  const M = VACA.MARGEM;
  c.x += c.vx * dt; c.y += c.vy * dt;
  if (c.x < M) { c.x = M; if (c.vx < 0) c.vx = 0; } else if (c.x > MUNDO - M) { c.x = MUNDO - M; if (c.vx > 0) c.vx = 0; }
  if (c.y < M) { c.y = M; if (c.vy < 0) c.vy = 0; } else if (c.y > MUNDO - M) { c.y = MUNDO - M; if (c.vy > 0) c.vy = 0; }
  const o = empurrarLagos(c.x, c.y, 40);
  if (o[2]) { c.x = o[0]; c.y = o[1]; c.vx *= .5; c.vy *= .5; }
  if (c.est !== "hurt" && c.est !== "death" && Math.abs(c.vx) > 10) c.dir = c.vx > 0 ? 1 : -1;
}

function atualizarVaca(c, dt) {
  c.t += dt;

  // modo teste (tecla G): mantém o estado forçado
  if (c.forcado > 0) {
    c.forcado -= dt;
    const v = c.est === "run" ? VACA.VEL_CORRER : c.est === "walk" ? VACA.VEL_ANDAR : 0;
    c.vx = c.dir * v; c.vy = 0;
    if ((c.x <= VACA.MARGEM + 1 && c.dir < 0) || (c.x >= MUNDO - VACA.MARGEM - 1 && c.dir > 0)) c.dir = -c.dir;
    moverVaca(c, dt); animarVaca(c, dt);
    if (c.forcado <= 0) { c.hp = VACA.VIDA; c.tMorte = 0; mudarEstado(c, "idle", 1); }
    return;
  }

  const dxp = c.x - jogX(), dyp = c.y - jogY(), dj = Math.hypot(dxp, dyp);
  const assustada = dj < VACA.FUGA_PERTO || (jogadorAndando && dj < VACA.FUGA_VISAO);
  let vx = 0, vy = 0, acel = 600;

  switch (c.est) {
    case "idle":
      if (assustada) fugir(c); else if (c.t > c.dur) decidir(c);
      break;
    case "walk": {
      if (assustada) { fugir(c); break; }
      const ax = c.alvo.x - c.x, ay = c.alvo.y - c.y, l = Math.hypot(ax, ay);
      if (l < 12 || c.t > c.dur) {
        if (c.lagoAlvo && l < 45) { c.dir = c.lagoAlvo.x < c.x ? -1 : 1; c.lagoAlvo = null; mudarEstado(c, "drink", aleatorio(4, 7)); }
        else { c.lagoAlvo = null; mudarEstado(c, "idle", aleatorio(1, 2.5)); }
      }
      else { vx = ax / l * VACA.VEL_ANDAR; vy = ay / l * VACA.VEL_ANDAR; }
      break;
    }
    case "run": {
      let ux = dxp, uy = dyp; const l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l;
      const M = VACA.MARGEM, W = 400;                       // afasta das beiradas para não ficar correndo parada
      ux += Math.max(0, 1 - (c.x - M) / W) * 1.5 - Math.max(0, 1 - (MUNDO - M - c.x) / W) * 1.5;
      uy += Math.max(0, 1 - (c.y - M) / W) * 1.5 - Math.max(0, 1 - (MUNDO - M - c.y) / W) * 1.5;
      for (const lg of lagos) {                             // contorna os lagos
        const ex = c.x - lg.x, ey = c.y - lg.y, dd = Math.hypot(ex, ey) || 1, RR = lg.rmax + 260;
        if (dd < RR) { const w = (1 - dd / RR) * 2.2; ux += ex / dd * w; uy += ey / dd * w; }
      }
      const l2 = Math.hypot(ux, uy) || 1;
      vx = ux / l2 * VACA.VEL_CORRER; vy = uy / l2 * VACA.VEL_CORRER; acel = 900;
      if ((dj > VACA.FUGA_FIM || c.t > 5) && c.t > .6) {      // acalmou: segue andando mais um pouco
        c.alvo = { x: c.x + c.vx * .4, y: c.y + c.vy * .4 };
        mudarEstado(c, "walk", 8);
      }
      break;
    }
    case "eat":
    case "drink":
      if (assustada) fugir(c); else if (c.t > c.dur) mudarEstado(c, "idle", aleatorio(1, 2.5));
      break;
    case "rest":
      if (dj < 110) { c.acordou = true; mudarEstado(c, "idle", .2); }
      else if (c.t > c.dur) {
        if (!c.acordou && Math.random() < .5) mudarEstado(c, "sleep", aleatorio(8, 15));
        else { c.acordou = false; mudarEstado(c, "idle", aleatorio(1, 2.5)); }
      }
      break;
    case "sleep":
      if (dj < 110 || c.t > c.dur) { c.acordou = true; mudarEstado(c, "rest", aleatorio(1, 2)); }
      break;
    case "hurt":
      acel = 500;
      if (c.t > c.dur) { if (c.morrer) { c.vx = c.vy = 0; mudarEstado(c, "death", 0); } else fugir(c); }
      break;
    case "death":
      c.tMorte += dt; acel = 800;
      if (c.tMorte > 29) {                                     // some e renasce em casa
        c.x = c.hx; c.y = c.hy; c.hp = VACA.VIDA; c.morrer = false; c.tMorte = 0;
        mudarEstado(c, "idle", 1);
      }
      break;
  }
  // se a transição acima criou uma caminhada sem alvo (fim da corrida), garante alvo válido
  if (c.est === "walk" && !c.alvo) c.alvo = { x: c.hx, y: c.hy };

  // comendo/bebendo: para na hora (sem deslizar pela inércia da caminhada)
  if (c.est === "eat" || c.est === "drink") { c.vx = 0; c.vy = 0; }
  else acelerar(c, vx, vy, dt, acel);
  moverVaca(c, dt);
  animarVaca(c, dt);
}

// vacas comendo/bebendo/dormindo ficam paradas (não são empurradas por outras vacas)
const estaticaNoChao = c => c.est === "sleep" || c.est === "rest" || c.est === "death" || c.est === "eat" || c.est === "drink";
function colisaoVaca(c) {  // elipse no chão (centro um pouco acima do casco)
  const d = c.est === "sleep" || c.est === "rest";
  return { x: c.x, y: c.y - 6, a: d ? VACA.RAIO_X + 12 : VACA.RAIO_X, b: d ? VACA.RAIO_Y + 2 : VACA.RAIO_Y };
}

function atualizarVacas(dt) {
  for (const c of vacas) atualizarVaca(c, dt);
  // vaca × vaca: separação suave (vacas deitadas não se movem)
  for (let i = 0; i < vacas.length; i++) {
    const a = vacas[i]; if (a.est === "death") continue;
    for (let j = i + 1; j < vacas.length; j++) {
      const b = vacas[j]; if (b.est === "death") continue;
      const ex = a.x - b.x; if (Math.abs(ex) > 110) continue;
      const k = 2, ey = (a.y - b.y) * k, d = Math.hypot(ex, ey), min = VACA.RAIO_X * 1.7;
      if (d >= min) continue;
      const nx = d ? ex / d : 1, ny = d ? ey / d : 0, push = (min - d);
      const wa = estaticaNoChao(a) ? 0 : 1, wb = estaticaNoChao(b) ? 0 : 1, ws = wa + wb;
      if (!ws) continue;
      a.x += nx * push * wa / ws; a.y += ny * push * wa / ws / k;
      b.x -= nx * push * wb / ws; b.y -= ny * push * wb / ws / k;
    }
  }
}

// jogador × vacas: a vaca é obstáculo (a elipse empurra o jogador para fora)
function colidirJogadorComVacas() {
  const r = TAM_JOGADOR * 0.45;
  let gx = jogX(), gy = jogY();
  for (const c of vacas) {
    if (c.est === "death" || c.est === "run" || c.est === "hurt") continue;   // vaca fugindo não trava o jogador
    const e = colisaoVaca(c);
    const A = e.a + r, B = e.b + r, k = A / B;          // elipse "inflada" pelo raio do jogador
    const ox = gx - e.x, oy = (gy - e.y) * k, d = Math.hypot(ox, oy);
    if (d >= A) continue;
    const nx = d ? ox / d : 1, ny = d ? oy / d : 0, push = A - d;
    gx += nx * push; gy += ny * push / k;
  }
  // (os lagos NÃO são obstáculos para o jogador: dá para nadar neles e no mar)
  p.x = Math.max(MIN_X, Math.min(MAX_X, gx - TAM_JOGADOR / 2));
  p.y = Math.max(MIN_X, Math.min(MAX_X, gy - TAM_JOGADOR * 0.85));
}

// ====== DESENHO (jogador + vacas ordenados pela posição no chão) ======
function desenharOndas() {
  if (!ondas.length) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.lineWidth = Math.max(1, Math.round(2 * zp));
  for (const o of ondas) {
    if (o.t < 0) continue;
    const u = o.t / 1.3, rx = (14 + 56 * u) * zp;
    ctx.strokeStyle = "rgba(235,244,255," + (0.8 * (1 - u)).toFixed(3) + ")";
    ctx.beginPath(); ctx.ellipse((o.x - cam.x) * zp, (o.y - cam.y) * zp, rx, rx * 0.38, 0, 0, 6.2832); ctx.stroke();
  }
}
function desenharJogador(t) {
  const k = nadoT;                                   // 0 = em terra, 1 = nadando
  const bob = k ? Math.round(Math.sin(t * 4.5) * 2 * zp * k) : 0;
  const sx = Math.round((p.x - cam.x) * zp), sy = Math.round((p.y - cam.y) * zp + (4 * zp * k) + bob);
  const sz = Math.round(TAM_JOGADOR * zp), bd = Math.max(1, Math.round(3 * zp));
  if (k < 0.98) {                                    // sombra some quando entra na água
    ctx.fillStyle = "rgba(0,0,0," + (0.25 * (1 - k)).toFixed(3) + ")";
    ctx.fillRect(sx + Math.round(4 * zp), sy + Math.round(6 * zp), sz, sz);
  }
  const sub = Math.round(sz * 0.5 * k), hh = sz - sub;       // parte do corpo que fica debaixo d'água
  ctx.fillStyle = "#7a3a10";
  ctx.fillRect(sx, sy, sz, hh);
  ctx.fillStyle = "#e8742a";
  ctx.fillRect(sx + bd, sy + bd, sz - 2 * bd, Math.max(1, hh - bd - Math.round(bd * (1 - k))));
  if (k > 0.02) {
    const cx = sx + sz / 2, wy = sy + hh;                    // linha d'água
    if (jogadorAndando) {                                    // braçadas
      const a = Math.max(2, Math.round(sz * 0.24)), sw = Math.round(Math.sin(t * 9) * 3 * zp);
      ctx.fillStyle = "#7a3a10";
      ctx.fillRect(sx - a, wy - Math.round(sz * 0.3) + sw, a, a);
      ctx.fillRect(sx + sz, wy - Math.round(sz * 0.3) - sw, a, a);
      ctx.fillStyle = "#e8742a";
      ctx.fillRect(sx - a + 1, wy - Math.round(sz * 0.3) + sw + 1, Math.max(1, a - 2), Math.max(1, a - 2));
      ctx.fillRect(sx + sz + 1, wy - Math.round(sz * 0.3) - sw + 1, Math.max(1, a - 2), Math.max(1, a - 2));
    }
    ctx.fillStyle = "rgba(102,204,255," + (0.6 * k).toFixed(3) + ")";      // água cobrindo o corpo
    ctx.beginPath(); ctx.ellipse(cx, wy, sz * 0.78, sz * 0.24, 0, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "rgba(235,244,255," + (0.9 * k).toFixed(3) + ")";    // espuma em volta
    ctx.lineWidth = Math.max(1, Math.round(2 * zp));
    ctx.stroke();
  }
}
function quadroVaca(c) { const A = ANIM_VACA[c.est]; return A.q[Math.min(c.fi, A.q.length - 1)]; }
const visiveis = [];
let rz = 1;   // razão entre o zoom atual e o zoom das texturas (durante o zoom as texturas são esticadas)
function desenharEntidades(t) {
  desenharOndas();
  const VW = innerWidth / zoom, VH = innerHeight / zoom;
  visiveis.length = 0;
  for (const c of vacas)
    if (c.x > cam.x - 220 && c.x < cam.x + VW + 220 && c.y > cam.y - 80 && c.y < cam.y + VH + 260) visiveis.push(c);

  // sombras (todas antes dos corpos)
  if (cowSpr) {
    ctx.fillStyle = "rgba(0,0,0,.22)";
    for (const c of visiveis) {
      const s = sprVaca(quadroVaca(c));
      const rx = s.bw * rz * 0.4, ry = Math.max(2, rx * 0.25);
      const sx = Math.round((c.x - cam.x) * zp), sy = Math.round((c.y - cam.y) * zp) - Math.round(ry * 0.5);
      ctx.beginPath(); ctx.ellipse(sx, sy, rx, ry, 0, 0, 6.2832); ctx.fill();
    }
  }
  // ordena por "pés" (quem está mais abaixo na tela fica na frente)
  visiveis.sort((a, b) => a.y - b.y);
  let jogadorFeito = false;
  const gyJog = p.y + TAM_JOGADOR;
  for (const c of visiveis) {
    if (!jogadorFeito && c.y > gyJog) { desenharJogador(t); jogadorFeito = true; }
    if (!cowSpr) continue;
    const s = sprVaca(quadroVaca(c));
    const sx = Math.round((c.x - cam.x) * zp), sy = Math.round((c.y - cam.y) * zp);
    const fade = c.est === "death" && c.tMorte > 26 ? Math.max(0, 1 - (c.tMorte - 26) / 3) : 1;
    if (fade < 1) ctx.globalAlpha = fade;
    const im = c.dir > 0 ? s.d : s.e, ox = (c.dir > 0 ? s.ax : s.axE);
    if (rz === 1) ctx.drawImage(im, sx - ox, sy - s.ay);
    else ctx.drawImage(im, sx - Math.round(ox * rz), sy - Math.round(s.ay * rz), Math.round(im.width * rz), Math.round(im.height * rz));
    if (fade < 1) ctx.globalAlpha = 1;
  }
  if (!jogadorFeito) desenharJogador(t);
}

const teclas = {};

addEventListener("keyup", e => { teclas[e.key.toLowerCase()] = false; });

// Zoom da câmera: roda do mouse ou teclas + / -
function mudarZoom(f) { zoomAlvo = Math.max(0.3, Math.min(1.5, zoomAlvo * f)); tZoom = performance.now(); }
addEventListener("wheel", e => { mudarZoom(e.deltaY > 0 ? 0.9 : 1.1); }, { passive: true });
addEventListener("keydown", e => {
  if (e.key === "+" || e.key === "=") mudarZoom(1.1);
  if (e.key === "-" || e.key === "_") mudarZoom(0.9);
});
// Pinça (celular)
let pinca = 0;
addEventListener("touchmove", e => {
  // pinça só vale com 2 dedos FORA do joystick e do botão Bater
  const livres = [...e.touches].filter(t => !(t.target.closest && t.target.closest("#joy, #atk")));
  if (livres.length === 2 && e.touches.length === 2) {
    const d = Math.hypot(livres[0].clientX - livres[1].clientX, livres[0].clientY - livres[1].clientY);
    if (pinca) mudarZoom(d / pinca);
    pinca = d;
  } else pinca = 0;
}, { passive: true });
addEventListener("touchend", () => { pinca = 0; });

// Joystick (celular)
const joy = document.getElementById("joy"), knob = document.getElementById("knob");
let joyVet = { x: 0, y: 0 }, joyId = null;
if ("ontouchstart" in window) joy.style.display = "block";
function moverKnob(t) {
  const b = joy.getBoundingClientRect();
  let dx = t.clientX - (b.left + 60), dy = t.clientY - (b.top + 60);
  const d = Math.hypot(dx, dy), max = 50;
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  knob.style.left = 40 + dx + "px"; knob.style.top = 40 + dy + "px";
  joyVet = { x: dx / max, y: dy / max };
}
joy.addEventListener("touchstart", e => { joyId = e.changedTouches[0].identifier; moverKnob(e.changedTouches[0]); e.preventDefault(); }, { passive: false });
joy.addEventListener("touchmove", e => {
  for (const t of e.changedTouches) if (t.identifier === joyId) moverKnob(t);
  e.preventDefault();
}, { passive: false });
function soltar(e) {
  for (const t of e.changedTouches) if (t.identifier === joyId) {
    joyId = null; joyVet = { x: 0, y: 0 }; knob.style.left = "40px"; knob.style.top = "40px";
  }
}
joy.addEventListener("touchend", soltar); joy.addEventListener("touchcancel", soltar);

// ====== RENDER OTIMIZADO ======
// Texturas pré-escaladas para o tamanho exato da tela e desenhadas em espaço de
// tela com deslocamento inteiro (caminho mais rápido do canvas), sem ctx.scale.
let zp = 1;
let gPat = null, gSize = 512, mPat = null, mSize = 768;
function refazerTexturas() {
  zFeito = zoom; zp = zoom * DPR; tz = zoom; tzp = zp;
  if (img.complete && img.naturalWidth) {
    gSize = Math.max(8, Math.round(img.naturalWidth * zp));
    const c = document.createElement("canvas"); c.width = c.height = gSize;
    c.getContext("2d").drawImage(img, 0, 0, gSize, gSize);
    gPat = ctx.createPattern(c, "repeat");
  }
  if (marSrc) {
    mSize = Math.max(8, Math.round(marSrc.width * zp));
    const c = document.createElement("canvas"); c.width = c.height = mSize;
    const cx = c.getContext("2d"); cx.imageSmoothingEnabled = false;
    cx.drawImage(marSrc, 0, 0, mSize, mSize);
    mPat = ctx.createPattern(c, "repeat");
  }
  montarSpritesVaca();
  montarTexturaLago();
  montarTexturaTerra();
}
const mod = (a, n) => ((a % n) + n) % n;
function preencher(pat, cor, ox, oy, x0, y0, x1, y1, r) {
  x0 = Math.max(0, x0); y0 = Math.max(0, y0);
  x1 = Math.min(canvas.width, x1); y1 = Math.min(canvas.height, y1);
  if (x1 <= x0 || y1 <= y0) return;
  ctx.setTransform(r, 0, 0, r, ox, oy);
  ctx.fillStyle = pat || cor;
  ctx.fillRect((x0 - ox) / r, (y0 - oy) / r, (x1 - x0) / r, (y1 - y0) / r);
}

// ====== VARIAÇÕES DA GRAMA ======
// Manchas grandes de cor (quebram a repetição da textura), tufos de capim e flores.
// Tudo é gerado por "chunk" com semente fixa (sempre nos mesmos lugares) e balança com um vento
// que passa pelo mapa em ondas, então a grama parece mudar de posição o tempo todo.
const CHUNK = 400, NCH = Math.ceil(MUNDO / CHUNK);
const CORES_GRAMA = [["#2f4d12", "#4f7a1f", "#7aa832"], ["#44681a", "#6f9a2e", "#9bc441"], ["#58761f", "#8bb23a", "#c3dc5a"]];
const CORES_FLOR = ["#ffffff", "#ffe14d", "#ff8fc2", "#8fc4ff", "#ff7a5c"];
const PXG = 3;                                     // tamanho (no mundo) de cada "pixel" dos tufos
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const tufos = [], flores = [], manchas = [];       // sprites: [variante][quadro de vento 0..2]
(function criarSpritesGrama() {
  const lean = [-1, 0, 1];
  const rnd = mulberry(777);
  for (let v = 0; v < 9; v++) {
    const pal = CORES_GRAMA[v % 3], lam = [];
    const blades = [];
    const n = 4 + Math.floor(rnd() * 4);
    for (let i = 0; i < n; i++) blades.push({ x: 2 + Math.floor(rnd() * 12), h: 5 + Math.floor(rnd() * 8), c: Math.floor(rnd() * 3) });
    for (let f = 0; f < 3; f++) {
      const c = document.createElement("canvas"); c.width = 16; c.height = 14;
      const x = c.getContext("2d");
      for (const b of blades) {
        x.fillStyle = pal[b.c];
        for (let i = 0; i < b.h; i++) {
          const off = Math.round(lean[f] * Math.pow(i / b.h, 2) * 3 * (b.x % 2 ? 1 : .6));
          x.fillRect(b.x + off, 13 - i, 1, 1);
        }
      }
      lam.push(c);
    }
    tufos.push(lam);
  }
  for (let v = 0; v < CORES_FLOR.length; v++) {
    const lam = [];
    for (let f = 0; f < 3; f++) {
      const c = document.createElement("canvas"); c.width = 7; c.height = 9;
      const x = c.getContext("2d"), o = lean[f];
      x.fillStyle = "#3f6a1a"; x.fillRect(3, 5, 1, 4); x.fillRect(2 + (o > 0 ? 1 : 0), 7, 1, 1);
      x.fillStyle = CORES_FLOR[v];
      x.fillRect(3 + o, 2, 1, 3); x.fillRect(2 + o, 3, 3, 1);
      x.fillStyle = "#ffd23a"; x.fillRect(3 + o, 3, 1, 1);
      lam.push(c);
    }
    flores.push(lam);
  }
  const tipos = ["rgba(25,55,8,.30)", "rgba(200,230,100,.22)", "rgba(170,160,60,.20)", "rgba(20,70,30,.22)"];
  for (const cor of tipos) {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const x = c.getContext("2d");
    const g = x.createRadialGradient(64, 64, 4, 64, 64, 64);
    g.addColorStop(0, cor); g.addColorStop(1, cor.replace(/[\d.]+\)$/, "0)"));
    x.fillStyle = g; x.fillRect(0, 0, 128, 128);
    manchas.push(c);
  }
})();

const chunksGrama = new Map();
function chunkGrama(cx, cy) {
  const key = cy * 1000 + cx;
  let ch = chunksGrama.get(key); if (ch) return ch;
  const rnd = mulberry(cx * 73856093 ^ cy * 19349663 ^ 12345);
  const X0 = cx * CHUNK, Y0 = cy * CHUNK, M = 30;
  const pos = () => [Math.max(M, Math.min(MUNDO - M, X0 + rnd() * CHUNK)), Math.max(M, Math.min(MUNDO - M, Y0 + rnd() * CHUNK))];
  ch = { m: [], t: [], f: [] };
  const nm = 1 + Math.floor(rnd() * 3);
  for (let i = 0; i < nm; i++) { const [x, y] = pos(); const s = 260 + rnd() * 520; ch.m.push({ x, y, w: s, h: s * (.5 + rnd() * .5), k: Math.floor(rnd() * manchas.length), ph: rnd() * 6.28 }); }
  const nt = 16 + Math.floor(rnd() * 12);
  for (let i = 0; i < nt; i++) { const [x, y] = pos(); ch.t.push({ x, y, v: Math.floor(rnd() * tufos.length), s: .8 + rnd() * .9, ph: rnd() * 6.28, esp: rnd() < .5 }); }
  const nf = Math.floor(rnd() * 4);
  for (let i = 0; i < nf; i++) { const [x, y] = pos(); ch.f.push({ x, y, v: Math.floor(rnd() * flores.length), s: 1 + rnd() * .6, ph: rnd() * 6.28 }); }
  ch.t.sort((a, b) => a.y - b.y); ch.f.sort((a, b) => a.y - b.y);
  chunksGrama.set(key, ch); return ch;
}
function quadroVento(x, y, ph, t) {
  const w = Math.sin(t * 1.5 + x * 0.0045 + y * 0.0025 + ph * .35) + Math.sin(t * .7 + ph) * .4;
  return w > .45 ? 2 : w < -.45 ? 0 : 1;
}
function desenharGrama(t) {
  const VW = innerWidth / zoom, VH = innerHeight / zoom;
  const c0 = Math.max(0, Math.floor((cam.x - 300) / CHUNK)), c1 = Math.min(NCH - 1, Math.floor((cam.x + VW + 300) / CHUNK));
  const r0 = Math.max(0, Math.floor((cam.y - 300) / CHUNK)), r1 = Math.min(NCH - 1, Math.floor((cam.y + VH + 300) / CHUNK));
  const detalhe = zoom > 0.42;                       // longe, tufos viram ruído: pula metade
  ctx.imageSmoothingEnabled = true;
  // 1) manchas de cor (pulsam devagar)
  for (let cy = r0; cy <= r1; cy++) for (let cx = c0; cx <= c1; cx++) {
    for (const m of chunkGrama(cx, cy).m) {
      const w = m.w * zp, h = m.h * zp;
      ctx.globalAlpha = .75 + .25 * Math.sin(t * .25 + m.ph);
      ctx.drawImage(manchas[m.k], (m.x - cam.x) * zp - w / 2, (m.y - cam.y) * zp - h / 2, w, h);
    }
  }
  ctx.globalAlpha = 1;
  // 2) tufos e flores (pixel art nítido, balançando com o vento)
  ctx.imageSmoothingEnabled = false;
  for (let cy = r0; cy <= r1; cy++) for (let cx = c0; cx <= c1; cx++) {
    const ch = chunkGrama(cx, cy);
    for (let i = 0; i < ch.t.length; i++) {
      if (!detalhe && (i & 1)) continue;
      const o = ch.t[i], sx = (o.x - cam.x) * zp, sy = (o.y - cam.y) * zp;
      if (sx < -60 || sy < -60 || sx > canvas.width + 60 || sy > canvas.height + 60) continue;
      const spr = tufos[o.v][quadroVento(o.x, o.y, o.ph, t)];
      const w = Math.max(2, Math.round(16 * PXG * o.s * zp)), h = Math.max(2, Math.round(14 * PXG * o.s * zp));
      ctx.drawImage(spr, Math.round(sx - w / 2), Math.round(sy - h), w, h);
    }
    if (detalhe) for (const o of ch.f) {
      const sx = (o.x - cam.x) * zp, sy = (o.y - cam.y) * zp;
      if (sx < -60 || sy < -60 || sx > canvas.width + 60 || sy > canvas.height + 60) continue;
      const spr = flores[o.v][quadroVento(o.x, o.y, o.ph, t)];
      const w = Math.round(7 * PXG * o.s * zp), h = Math.round(9 * PXG * o.s * zp);
      ctx.drawImage(spr, Math.round(sx - w / 2), Math.round(sy - h), w, h);
    }
  }
  ctx.imageSmoothingEnabled = true;
}

// ====== LOOP ======
const hudPos = document.getElementById("pos"), hudVaca = document.getElementById("vinfo");
let hudT = 0;
let ultimo = performance.now();
function loop(agora) {
  const dt = Math.max(0, Math.min((agora - ultimo) / 1000, .05)); ultimo = agora;

  let dx = (teclas["d"] || teclas["arrowright"] ? 1 : 0) - (teclas["a"] || teclas["arrowleft"] ? 1 : 0);
  let dy = (teclas["s"] || teclas["arrowdown"] ? 1 : 0) - (teclas["w"] || teclas["arrowup"] ? 1 : 0);
  dx += joyVet.x; dy += joyVet.y;
  const m = Math.hypot(dx, dy);
  if (m > 1) { dx /= m; dy /= m; }
  const vel = VELOCIDADE * (1 - (1 - VEL_NADO) * nadoT);          // nadar é mais lento
  p.x = Math.max(MIN_X, Math.min(MAX_X, p.x + dx * vel * dt));
  p.y = Math.max(MIN_X, Math.min(MAX_X, p.y + dy * vel * dt));
  jogadorAndando = m > 0.05;
  // entrou / saiu da água?
  const agoraNaAgua = naAgua(jogX(), jogY());
  if (agoraNaAgua !== nadando) { nadando = agoraNaAgua; marolas(3); ondaT = 0; }
  nadoT += ((nadando ? 1 : 0) - nadoT) * Math.min(1, dt * 8);
  if (Math.abs((nadando ? 1 : 0) - nadoT) < 0.01) nadoT = nadando ? 1 : 0;
  if (nadando) {                                                   // rastro de ondinhas
    ondaT += dt;
    if (ondaT > (jogadorAndando ? 0.16 : 0.7)) { ondaT = 0; marolas(1); }
  }
  for (let i = ondas.length - 1; i >= 0; i--) { ondas[i].t += dt; if (ondas[i].t > 1.3) ondas.splice(i, 1); }
  atualizarVacas(dt);
  colidirJogadorComVacas();

  // zoom suave (interpola até o alvo)
  zoom += (zoomAlvo - zoom) * Math.min(1, dt * 12);
  if (Math.abs(zoomAlvo - zoom) < zoomAlvo * 0.0008) zoom = zoomAlvo;

  const VW = innerWidth / zoom, VH = innerHeight / zoom;
  cam.x = Math.max(-MAR, Math.min(MUNDO + MAR - VW, p.x + TAM_JOGADOR / 2 - VW / 2));
  cam.y = Math.max(-MAR, Math.min(MUNDO + MAR - VH, p.y + TAM_JOGADOR / 2 - VH / 2));

  // texturas só são refeitas quando o zoom PARA (durante o zoom elas são apenas esticadas: sem travadas)
  const zoomParou = zoom === zoomAlvo && agora - tZoom > 150;
  if (!zFeito || (!gPat && img.complete && img.naturalWidth) || (!cowSpr && cowImg.complete && cowImg.naturalWidth) || (!lPat && aguaImg.complete && aguaImg.naturalWidth) || (!tPat && terraImg.complete && terraImg.naturalWidth) || (zoomParou && Math.abs(zoom / tz - 1) > 0.004)) refazerTexturas();
  zp = zoom * DPR;
  const r = zoom / tz; rz = Math.abs(r - 1) < 0.0005 ? 1 : r;

  const W = canvas.width, H = canvas.height;
  const ix0 = Math.round(-cam.x * zp), iy0 = Math.round(-cam.y * zp);
  const ix1 = Math.round((MUNDO - cam.x) * zp), iy1 = Math.round((MUNDO - cam.y) * zp);

  // mar: só as faixas fora da ilha
  const t = agora / 1000;
  const mox = mod(Math.round((-cam.x + (t * 18) % 768) * zp), mSize * rz);
  const moy = mod(Math.round((-cam.y + (t * 9) % 768) * zp), mSize * rz);
  preencher(mPat, "#66ccff", mox, moy, 0, 0, W, iy0, rz);
  preencher(mPat, "#66ccff", mox, moy, 0, iy1, W, H, rz);
  preencher(mPat, "#66ccff", mox, moy, 0, iy0, ix0, iy1, rz);
  preencher(mPat, "#66ccff", mox, moy, ix1, iy0, W, iy1, rz);

  // ilha de grama
  preencher(gPat, "#5f7f25", mod(ix0, gSize * rz), mod(iy0, gSize * rz), ix0, iy0, ix1, iy1, rz);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  desenharGrama(t);
  desenharBordaMolhada();
  // faixa de espuma na beira da praia
  const h = Math.max(1, Math.round(8 * zp));
  ctx.fillStyle = "rgba(226,232,242,.9)";
  ctx.fillRect(ix0 - h, iy0 - h, ix1 - ix0 + 2 * h, 2 * h);
  ctx.fillRect(ix0 - h, iy1 - h, ix1 - ix0 + 2 * h, 2 * h);
  ctx.fillRect(ix0 - h, iy0 - h, 2 * h, iy1 - iy0 + 2 * h);
  ctx.fillRect(ix1 - h, iy0 - h, 2 * h, iy1 - iy0 + 2 * h);

  desenharLagos(t);

  // jogador + vacas (ordenados pela posição no chão)
  desenharEntidades(t);

  // HUD só ~4x por segundo (mexer no DOM todo frame força layout)
  if (agora - hudT > 250) {
    hudT = agora;
    hudPos.textContent = `x: ${p.x | 0}  y: ${p.y | 0}` + (nadando ? "  🏊 nadando" : "");
    let vp = null, vd = 700;
    for (const c of vacas) { const d = Math.hypot(c.x - jogX(), c.y - jogY()); if (d < vd) { vd = d; vp = c; } }
    hudVaca.textContent = vp ? `vaca: ${vp.est} (${vp.hp}/${VACA.VIDA})` : "";
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
